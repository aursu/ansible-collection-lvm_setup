---
galaxy_info:
  author: Alexander Ursu
  description: >
    Ansible role to prepare LVM Physical Volumes (PVs) and create a Volume Group (VG).
    Validates partitions, checks device suitability, and manages VG creation or extension.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    # Quoted, and matching process_disks. Bare 9 loads as an int and bare 22.04
    # as a float, which the galaxy_info schema rejects - and 22.10 would silently
    # become 22.1. Same class of mistake as an unquoted min_ansible_version.
    - name: EL
      versions: ["9", "10"]
    - name: Ubuntu
      versions: ["jammy", "noble"]
  galaxy_tags:
    - lvm
    - volumes
    - storage
    - vg
    - pv
    - linux
dependencies: []
