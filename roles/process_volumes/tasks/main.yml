- name: Determine if partitions input should be processed
  ansible.builtin.set_fact:
    process_volumes: "{{ volumes is defined and volumes | length > 0 }}"

- block:
    # The filter checks each volume itself, so an unsupported filesystem fails
    # here with the collection's usual message, before anything is installed.
    - name: Ensure the LVM and filesystem tools are installed
      ansible.builtin.package:
        name: >-
          {{ volumes | aursu.lvm_setup.required_packages(process_volumes_packages,
                                                          process_volumes_filesystem_packages) }}
        state: present

    - name: Validate input and prerequisites
      import_tasks: validate.yml

    - name: Process each entity defined in volumes
      ansible.builtin.include_tasks: create_lv.yml
      loop: "{{ volumes }}"
      loop_control:
        loop_var: lv
        label: "{{ lv.name }}"
  when: process_volumes

- block:
    - debug: msg="Skip processing if volumes variable is undefined or empty"
      when: debug_mode | default(false)
  when: not process_volumes
