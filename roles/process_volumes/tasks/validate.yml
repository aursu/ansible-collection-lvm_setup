- name: Validate structure of volumes input
  ansible.builtin.assert:
    that:
      - volumes | aursu.lvm_setup.validate_volumes_input
    fail_msg: "Invalid structure in 'volumes' input."

# After the input check, which rejects an unsupported filesystem with a clear
# message; before the first call that needs lvm2.
- name: Ensure the LVM and filesystem tools are installed
  ansible.builtin.package:
    name: >-
      {{ process_volumes_packages
         + (volumes | selectattr('filesystem', 'defined') | map(attribute='filesystem')
            | unique | map('extract', process_volumes_filesystem_packages) | list) }}
    state: present

- name: Get current LVM info
  aursu.general.lvm_info:
    filter: vgs,lvs
  register: lvm_info

- debug: var=lvm_info
  when: debug_mode | default(false)

- name: Validate if Volume group exists
  ansible.builtin.assert:
    that:
      - vg_name | aursu.lvm_setup.validate_vg(lvm_info)
    fail_msg: "Volume group {{ vg_name }} not found in system."
