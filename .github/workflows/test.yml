---
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      # The collection must sit at ansible_collections/<ns>/<name> inside the
      # workspace, because everything in it imports by the full
      # ansible_collections.aursu.lvm_setup path. A plain checkout into the
      # workspace root makes every import fail.
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/aursu/lvm_setup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pytest-subtests is not optional: the existing suite uses subtests, and
      # without it those cases error rather than run.
      - name: Install the test toolchain
        run: pip install --disable-pip-version-check ansible-core pytest pytest-subtests

      - name: Doctests
        working-directory: ansible_collections/aursu/lvm_setup
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m doctest plugins/plugin_utils/mount_helpers.py -v | tail -3

      - name: Unit tests
        working-directory: ansible_collections/aursu/lvm_setup
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/unit -q

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest

    # BLOCKING. It was not, and that is how 1.3.0 shipped an unparseable
    # create_lv.yml: ansible-lint reported load-failure[yaml] at line 79 and
    # exited 2, and continue-on-error discarded the result, because a file that
    # cannot be read was treated the same as a naming-convention warning.
    #
    # The 72 pre-existing stylistic violations that motivated that switch are now
    # warn-listed by name in .ansible-lint, so they report without failing. The
    # rules that matter - load-failure and syntax-check - are tagged unskippable
    # and cannot be warn-listed away, which is what makes blocking safe rather
    # than merely strict.

    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/aursu/lvm_setup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install --disable-pip-version-check ansible-lint

      # syntax-check resolves module references against installed collections, so
      # every collection the roles call must be present or the report is dominated
      # by modules that are simply absent. aursu.general tracks main rather than the
      # pinned tag so the lint job is not blocked on a release being cut.
      - name: Install the collections the roles call
        run: |
          ansible-galaxy collection install \
            git+https://github.com/aursu/ansible-collection-general.git,main
          ansible-galaxy collection install community.general ansible.posix

      # .ansible-lint warn-lists the pre-existing stylistic rules; everything else
      # fails the build, load-failure and syntax-check included.
      - name: Lint the roles and playbooks
        working-directory: ansible_collections/aursu/lvm_setup
        run: ansible-lint roles/ playbooks/
